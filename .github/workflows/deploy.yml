name: Deploy to Shopify Oxygen

on:
  push:
    branches: [main]

# Only one deploy runs at a time. Cancel in-progress runs if a new push lands.
concurrency:
  group: oxygen-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Oxygen
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify storefront payload
        run: npm run payload-health

      - name: Verify storefront release gate
        run: npm run launch-check

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Shopify Oxygen
        run: |
          if [ -z "$SHOPIFY_HYDROGEN_DEPLOY_TOKEN" ]; then
            echo "::error::SHOPIFY_HYDROGEN_DEPLOY_TOKEN is not configured"
            exit 1
          fi
          npx shopify hydrogen deploy --env-branch "$GITHUB_REF_NAME" --token "$SHOPIFY_HYDROGEN_DEPLOY_TOKEN" --force
        env:
          # Create an Oxygen deployment token in Shopify and add it at
          # GitHub repo → Settings → Secrets and variables → Actions.
          SHOPIFY_HYDROGEN_DEPLOY_TOKEN: ${{ secrets.SHOPIFY_HYDROGEN_DEPLOY_TOKEN }}

      - name: Verify live production storefront
        run: |
          for attempt in 1 2 3; do
            npm run production-health && npm run metadata-health && npm run link-health && exit 0
            echo "Production verification attempt $attempt failed; waiting for Oxygen propagation."
            sleep 20
          done
          exit 1

      # Renders the deployed site in Chromium and checks WCAG + layout for
      # real. Everything in `npm test` is a regex over source text and cannot
      # see contrast, focus order, or a single pixel of layout.
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      # NON-BLOCKING ON PURPOSE, for now. This lands with an unknown backlog:
      # the site has never been scanned by axe, so the first run is the first
      # time anyone sees the list. Failing deploys on day one would just get
      # this step deleted. Read the summary, clear the backlog, then delete
      # `continue-on-error` so it starts holding the line.
      - name: Browser checks (WCAG + layout)
        id: browser_checks
        continue-on-error: true
        run: npm run browser-check
        env:
          PUCHICA_TARGET: https://puchica.ca

      - name: Report browser-check result
        if: always()
        run: |
          if [ "${{ steps.browser_checks.outcome }}" = "success" ]; then
            echo "### Browser checks passed" >> "$GITHUB_STEP_SUMMARY"
            echo "Remove \`continue-on-error\` from the browser-check step to make this blocking." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Browser checks found problems (not blocking this deploy)" >> "$GITHUB_STEP_SUMMARY"
            echo "See the step log above for the failing routes and viewports." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload browser-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: reports/browser-checks.json
          if-no-files-found: ignore
          retention-days: 30
