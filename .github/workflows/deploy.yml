name: Deploy to Shopify Oxygen

on:
  push:
    branches: [main]

# Only one deploy runs at a time. Cancel in-progress runs if a new push lands.
concurrency:
  group: oxygen-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Oxygen
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Before `npm test`, not after: tests/browser/probes.test.js drives a real
      # Chromium, and without the binary those tests skip rather than run —
      # which looks identical to passing. They shipped broken once exactly this
      # way, so the browser is installed up front and they execute for real.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Verify storefront payload
        run: npm run payload-health

      - name: Verify storefront release gate
        run: npm run launch-check

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Shopify Oxygen
        run: |
          if [ -z "$SHOPIFY_HYDROGEN_DEPLOY_TOKEN" ]; then
            echo "::error::SHOPIFY_HYDROGEN_DEPLOY_TOKEN is not configured"
            exit 1
          fi
          npx shopify hydrogen deploy --env-branch "$GITHUB_REF_NAME" --token "$SHOPIFY_HYDROGEN_DEPLOY_TOKEN" --force
        env:
          # Create an Oxygen deployment token in Shopify and add it at
          # GitHub repo → Settings → Secrets and variables → Actions.
          SHOPIFY_HYDROGEN_DEPLOY_TOKEN: ${{ secrets.SHOPIFY_HYDROGEN_DEPLOY_TOKEN }}

      - name: Verify live production storefront
        run: |
          for attempt in 1 2 3; do
            npm run production-health && npm run metadata-health && npm run link-health && exit 0
            echo "Production verification attempt $attempt failed; waiting for Oxygen propagation."
            sleep 20
          done
          exit 1

      # BLOCKING. It landed non-blocking because the site had never been
      # scanned and a step that fails every deploy on day one gets deleted
      # rather than fixed. The backlog is now clear - all 68 checks pass
      # against production - so it holds the line from here.
      - name: Browser checks (WCAG + layout)
        id: browser_checks
        run: npm run browser-check
        env:
          PUCHICA_TARGET: https://puchica.ca

      - name: Report browser-check result
        if: always()
        run: |
          if [ "${{ steps.browser_checks.outcome }}" = "success" ]; then
            echo "### Browser checks passed" >> "$GITHUB_STEP_SUMMARY"
            echo "68 checks: axe WCAG 2.0/2.1/2.2 AA, overflow, image distortion, image resolution and tap-target size, across four routes at four viewports." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Browser checks failed" >> "$GITHUB_STEP_SUMMARY"
            echo "The deploy is blocked. Download the browser-checks artifact for the failing routes, viewports and selectors." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload browser-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: reports/browser-checks.json
          if-no-files-found: ignore
          retention-days: 30
