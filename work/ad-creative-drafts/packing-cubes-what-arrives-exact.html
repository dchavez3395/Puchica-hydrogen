<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puchica — What actually arrives</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: #e9e4da;
        color: #111a2b;
        font-family: Arial, Helvetica, sans-serif;
      }
      .creative {
        background:
          radial-gradient(circle at 78% 8%, rgba(101, 70, 238, .18), transparent 28%),
          linear-gradient(165deg, #fbfaf7 0%, #f3efe7 58%, #e7e1ff 100%);
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 1920px;
        overflow: hidden;
        padding: 92px 78px 74px;
        position: relative;
        width: 1080px;
      }
      .brand {
        align-items: center;
        display: flex;
        font-size: 26px;
        font-weight: 800;
        gap: 14px;
        letter-spacing: -.02em;
      }
      .mark {
        align-items: center;
        background: #6246ee;
        border-radius: 15px;
        color: #fff;
        display: inline-flex;
        font-size: 29px;
        height: 54px;
        justify-content: center;
        width: 54px;
      }
      .eyebrow {
        color: #19765f;
        font-size: 24px;
        font-weight: 850;
        letter-spacing: .14em;
        margin: 84px 0 26px;
        text-transform: uppercase;
      }
      h1 {
        font-size: 88px;
        letter-spacing: -.055em;
        line-height: .94;
        margin: 0;
        max-width: 9ch;
      }
      .subhead {
        color: #566072;
        font-size: 34px;
        line-height: 1.28;
        margin: 34px 0 0;
        max-width: 21ch;
      }
      .product-card {
        align-self: center;
        background: #fff;
        border: 2px solid rgba(17, 26, 43, .1);
        border-radius: 38px;
        box-shadow: -18px 18px 0 #ded5ff, 0 24px 70px rgba(17, 26, 43, .12);
        margin: 66px 6px 56px 18px;
        overflow: hidden;
        padding: 34px;
      }
      .product-card img {
        display: block;
        height: auto;
        object-fit: contain;
        width: 100%;
      }
      .included {
        align-items: center;
        border-top: 2px solid rgba(17, 26, 43, .1);
        display: flex;
        font-size: 29px;
        font-weight: 750;
        justify-content: space-between;
        padding-top: 34px;
      }
      .included span:last-child { color: #6246ee; }
      .cta-row {
        align-items: center;
        display: flex;
        justify-content: space-between;
      }
      .shipping {
        color: #566072;
        font-size: 23px;
        line-height: 1.35;
        max-width: 18ch;
      }
      .cta {
        background: #111a2b;
        border-radius: 18px;
        color: #fff;
        font-size: 27px;
        font-weight: 850;
        padding: 25px 38px;
      }
    </style>
  </head>
  <body>
    <main class="creative">
      <header>
        <div class="brand"><span class="mark">P</span>Puchica</div>
        <p class="eyebrow">What actually arrives</p>
        <h1>The complete 5-piece red set.</h1>
        <p class="subhead">A clear look at every organizer included.</p>
      </header>

      <section class="product-card" aria-label="Exact five-piece product set">
        <img
          src="packing-cubes-exact-source.webp"
          alt="Exact red five-piece packing organizer set"
        />
        <div class="included">
          <span>4 packing cubes + 1 shoe bag</span>
          <span>5 pieces</span>
        </div>
      </section>

      <footer class="cta-row">
        <div class="shipping">Shipping options shown at checkout</div>
        <div class="cta">See the set →</div>
      </footer>
    </main>
  </body>
</html>
