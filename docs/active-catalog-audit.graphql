query ActiveCatalogAudit {
  tShirt: product(id: "gid://shopify/Product/9326918369530") {
    ...ActiveProduct
  }
  sweater: product(id: "gid://shopify/Product/9326918598906") {
    ...ActiveProduct
  }
  petFoodSet: product(id: "gid://shopify/Product/9326920368378") {
    ...ActiveProduct
  }
  constructionSet: product(id: "gid://shopify/Product/9326920532218") {
    ...ActiveProduct
  }
  raisedPetBowl: product(id: "gid://shopify/Product/9326921187578") {
    ...ActiveProduct
  }
  miniDrone: product(id: "gid://shopify/Product/9327026569466") {
    ...ActiveProduct
  }
}

fragment ActiveProduct on Product {
  id
  title
  handle
  status
  tags
  seo {
    title
    description
  }
  variants(first: 100) {
    nodes {
      id
      title
      sku
      price
      inventoryQuantity
    }
  }
}
